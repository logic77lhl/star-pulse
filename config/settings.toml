# star-pulse 运行配置
# 修改后无需重启，下次运行自动生效

[candidate]
# 候选池上限。每日快照会对池内每个仓库发 1 次 REST 请求。
# 认证后配额 5000 次/小时，800 有大量富余；未认证只有 60 次/小时，建议 <= 40。
max_candidates = 800
# 给「池内续期」预留的保底名额。搜索渠道只覆盖「最近 search_lookback_days 天创建」
# 的仓库，一个项目滑出这个窗口后就再也发现不到了 —— 没有保底名额，它当天就拿不到
# 快照，星数增量永久中断。预留出来的名额按「已追踪最久」优先续上。
# 想让它更小（更偏向新项目）就调小；设 0 = 退回旧的「搜索优先」行为。
pool_refresh_reserve = 200
# 用 Search API 找「近期创建且已有一定星数」的新项目，回溯天数
search_lookback_days = 14
# 新项目的星数门槛
search_min_stars = 50
# 语言过滤。["All"] 表示不过滤
languages = ["All"]
# Trending 页窗口：daily 或 weekly
trending_since = "daily"
# 是否为每个语言子页各抓一次 Trending（更全，但请求更多）
trending_per_language = false

[report]
# 榜单长度
top_n = 20
# 报告日期归属时区偏移（小时）。8 = UTC+8
tz_offset_hours = 8
# 增量时间跨度上限。超过此天数的仓库视为快照断档，从榜上剔除并记录
# 设小更严格；设大可保留更多数据但会混入不公平比较
max_span_days = 10

[network]
# 两次请求之间的最小间隔（秒）。GitHub 有二级限流，串行 + 间隔最安全
request_gap_seconds = 0.15
# 每小时请求配额上限。Actions 内置的 GITHUB_TOKEN 是 1000/小时，
# 个人 PAT 是 5000/小时。写错会让开跑前的预检形同虚设。
rate_limit_per_hour = 1000
# 遇到限流时最长等待（秒）。超过则中止本次运行，避免 CI 卡死。
# 必须显著小于 workflow 的 timeout-minutes，否则 Actions 会先杀掉进程，
# 「配额耗尽也要保住已采数据」的兜底就永远执行不到。
# daily.yml 现为 45 分钟，这里留 15 分钟等待预算。
max_wait_seconds = 900
# 单个请求超时
timeout_seconds = 30
# 失败重试次数
retries = 3

[i18n]
# 简介中文化的后端。
#   auto       配了 LLM_* 就用 LLM，否则自动退回 mymemory（推荐）
#   llm        OpenAI 兼容接口，质量最好，需要 .env 里的 LLM_* 三项
#   mymemory   免费机翻，**不需要任何密钥**，见下方 email
#   none       不翻译，页面显示英文原文
backend = "auto"
# MyMemory 免费额度：匿名 5000 字符/天，填一个邮箱即提到 50000 字符/天。
# 只用于向对方说明调用方身份（对方出问题时会邮件联系），不会收到推广邮件。
# 按 800 条 × 80 字符估算，一次性补齐历史欠账约需 2 天，之后每周新增仅几千字符。
email = ""
# mymemory 是逐条请求，留间隔避免被限流
request_gap_seconds = 1.0
