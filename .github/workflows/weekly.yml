name: weekly report

# 周一 02:00 UTC = 周一 10:00（UTC+8）。此时上一自然周（周一~周日）已完整闭合。
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch: # 手动补跑

permissions:
  contents: write

# 与 daily.yml 用**同一个 group**：两者都会提交到 main，各自用不同的 group
# 等于没有互斥，会互相把对方的 push 顶成 non-fast-forward（已踩过）。
concurrency:
  group: star-pulse-repo
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    # 留足余量：回归测试 + 周报（含可选的 LLM 调用）+ 站点重建。
    # 同样要大于 settings.toml 的 network.max_wait_seconds。
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 —— 提交前要 git pull --rebase，浅克隆上会失败
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 先跑回归测试。用的是已发布并三源互证的历史榜单做基准，
      # 一旦增量计算被改坏，这里会立刻拦住，而不是产出一份错榜单。
      - name: 回归测试
        run: python tests/test_pipeline.py

      - name: 生成周报
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # LLM 三项是可选的。没配也不会失败，只是少一段中文解读。
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python -m star_pulse report --period last-week

      - name: 维护 LATEST 与索引
        run: |
          latest=$(ls -t reports/*.md 2>/dev/null | head -1 || true)
          if [ -n "$latest" ]; then
            cp "$latest" reports/LATEST.md
            echo "最新一期：$latest"
          fi

      # 中文简介由 daily.yml 每天补（候选池是滚动窗口，每天约 90 个新仓库进池，
      # 每周补一次永远追不上）。这里不再重复跑，只负责把它提交出去。
      - name: 重建站点（含归档本期周报）
        run: python -m star_pulse site

      - name: 写入运行摘要
        run: |
          if [ -f reports/LATEST.md ]; then
            cat reports/LATEST.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 提交报告与站点
        run: |
          git config user.name  "star-pulse-bot"
          git config user.email "star-pulse-bot@users.noreply.github.com"
          # 容错 add：data/history 只有在真的裁剪过之后才会存在
          for p in reports data/snapshots data/history data/i18n docs; do
            if [ -e "$p" ]; then git add -A -- "$p"; fi
          done
          if git diff --staged --quiet; then
            echo "没有变更，跳过提交"
            exit 0
          fi
          week=$(TZ=Asia/Shanghai date +%G-W%V)
          git commit -m "chore(report): ${week} 星耀榜 [skip ci]"
          # 与 daily 可能同时跑（手动补跑时最容易撞），push 前先 rebase
          for i in 1 2 3; do
            if git pull --rebase --autostash --quiet origin main && git push --quiet; then
              echo "提交成功（第 $i 次尝试）"
              exit 0
            fi
            echo "push 失败，5s 后重试（$i/3）"
            sleep 5
          done
          echo "::error::push 连续失败，请检查分支保护或并发提交"
          exit 1
